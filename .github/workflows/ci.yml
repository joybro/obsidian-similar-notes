name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            # onnxruntime-node (a transitive dependency of @huggingface/transformers)
            # downloads CUDA binaries in its postinstall; the v1.21.0 GPU tarball now
            # 404s and fails `npm install`. The plugin bundle never uses
            # onnxruntime-node, so skip that download.
            ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test

            - name: Build
              run: npm run build
