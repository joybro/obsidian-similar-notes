name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"
    # Manual run from a branch: install and build only (no release), to check
    # the pipeline before pushing a tag.
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            # onnxruntime-node (a transitive dependency of @huggingface/transformers)
            # downloads CUDA binaries in its postinstall; the v1.21.0 GPU tarball now
            # 404s and fails `npm install`. The plugin bundle never uses
            # onnxruntime-node, so skip that download.
            ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        permissions:
            contents: write
            # For actions/attest-build-provenance on tag releases.
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"

            - name: Build plugin
              run: |
                  npm install
                  npm run build

            - name: Create release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # Sync the RELEASE-ASSET manifest version to the tag. BRAT uses
                  # the release tag as the source of truth and warns testers when
                  # the asset manifest.json disagrees, so we make them match (BRAT's
                  # documented best practice). This edits only the uploaded asset,
                  # NOT the committed default-branch manifest.json — the community
                  # store reads the default-branch file, so stable users are
                  # unaffected. No-op for stable tags (manifest already matches).
                  node -e "const f='manifest.json',m=require('./'+f);m.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(m,null,4)+'\n')" "$tag"

                  # A pre-release tag (X.Y.Z-beta.N) also takes X.Y.Z's minAppVersion
                  # from versions.json, so BRAT testers on an older Obsidian are not
                  # offered a build that needs a newer one. The committed manifest
                  # keeps the previous stable's minAppVersion until the stable bump.
                  node -e "const fs=require('fs'),f='manifest.json',m=require('./'+f),base=process.argv[1].split('-')[0];if(base!==process.argv[1]&&fs.existsSync('versions.json')){const v=JSON.parse(fs.readFileSync('versions.json','utf8'))[base];if(v){m.minAppVersion=v;fs.writeFileSync(f,JSON.stringify(m,null,4)+'\n')}}" "$tag"

                  # Auto-mark beta/alpha/rc tags as a GitHub pre-release so the
                  # maintainer no longer has to tick the checkbox before publishing.
                  prerelease=""
                  case "$tag" in *-beta*|*-alpha*|*-rc*) prerelease="--prerelease" ;; esac

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft $prerelease \
                    main.js manifest.json styles.css

            # Signed build provenance for the uploaded files (Obsidian's community
            # scorecard lists missing attestations). Runs after the manifest edit
            # above, so it covers the exact files in the release.
            - name: Attest release assets
              if: startsWith(github.ref, 'refs/tags/')
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
